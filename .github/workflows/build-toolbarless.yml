name: Build Toolbarless Firefox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      FIREFOX_COMMIT: 079065d33b0b788f93395938d10660927761dceb
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild

    steps:
      - name: Show available storage
        run: df -h

      - name: Download Firefox source
        run: |
          git init firefox
          cd firefox
          git remote add origin https://github.com/mozilla-firefox/firefox.git
          git fetch --depth=1 --filter=blob:none origin "$FIREFOX_COMMIT"
          git checkout --detach FETCH_HEAD

      - name: Prepare Android build tools
        working-directory: firefox
        run: |
          ./mach --no-interactive bootstrap \
            --application-choice="GeckoView/Firefox for Android Artifact Mode"
          ./mach build
      - name: Build setup Firefox
        working-directory: firefox
        run: |
          ./mach gradle fenix:assembleDebug

          mkdir -p ../finished-apks

          SETUP_APK="$(find . -type f -name '*.apk' \
            ! -name '*androidTest*' \
            | grep -E 'arm64-v8a|aarch64' \
            | head -n 1)"

          if [ -z "$SETUP_APK" ]; then
            SETUP_APK="$(find . -type f -name '*.apk' \
              ! -name '*androidTest*' \
              | head -n 1)"
          fi

          if [ -z "$SETUP_APK" ]; then
            echo "No setup APK was found."
            exit 1
          fi

          echo "Setup APK: $SETUP_APK"
          cp "$SETUP_APK" ../finished-apks/firefox-setup.apk

      - name: Permanently hide the browsing toolbar
        working-directory: firefox
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "mobile/android/fenix/app/src/main/java/"
              "org/mozilla/fenix/components/toolbar/"
              "BrowserToolbarComposable.kt"
          )

          text = path.read_text()

          old_init = """    init {
                  container.addView(layout)
                  setToolbarBehavior(settings.toolbarPosition)
              }"""

          new_init = """    init {
                  layout.visibility = View.GONE
                  container.addView(layout)
                  setToolbarBehavior(settings.toolbarPosition)
              }"""

          old_visible = """    internal fun visible() {
                  layout.isVisible = true
              }"""

          new_visible = """    internal fun visible() {
                  layout.visibility = View.GONE
              }"""

          if old_init not in text:
              raise SystemExit("Could not find the toolbar setup code.")

          if old_visible not in text:
              raise SystemExit("Could not find the toolbar visibility code.")

          text = text.replace(old_init, new_init, 1)
          text = text.replace(old_visible, new_visible, 1)
          path.write_text(text)

          print("Toolbar-hiding modification applied successfully.")
          PY

      - name: Build locked Firefox
        working-directory: firefox
        run: |
          ./mach gradle fenix:assembleDebug

          LOCKED_APK="$(find . -type f -name '*.apk' \
            ! -name '*androidTest*' \
            | grep -E 'arm64-v8a|aarch64' \
            | head -n 1)"

          if [ -z "$LOCKED_APK" ]; then
            LOCKED_APK="$(find . -type f -name '*.apk' \
              ! -name '*androidTest*' \
              | head -n 1)"
          fi

          if [ -z "$LOCKED_APK" ]; then
            echo "No locked APK was found."
            exit 1
          fi

          echo "Locked APK: $LOCKED_APK"
          cp "$LOCKED_APK" ../finished-apks/firefox-toolbarless.apk

      - name: Create checksums
        run: |
          cd finished-apks
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Save both Firefox APKs
        uses: actions/upload-artifact@v4
        with:
          name: toolbarless-firefox-apks
          path: finished-apks/

      - name: Rebuild unmodified Firefox for emulator
        working-directory: firefox
        run: |
          git checkout -- mobile/android/fenix/app/src/main/java/org/mozilla/fenix/components/toolbar/BrowserToolbarComposable.kt
          ./mach clobber
          sed -i '/^ac_add_options --target=/d' mozconfig
          echo 'ac_add_options --target=x86_64-linux-android' >> mozconfig
          ./mach build
          ./mach gradle fenix:assembleDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test unmodified Firefox in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            APK="$(find firefox -type f -name 'fenix-x86_64-debug.apk' | head -n 1)"
            echo "Emulator APK: $APK"
            test -n "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p org.mozilla.fenix.debug -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d -v threadtime > firefox-emulator-log.txt
            if ! adb shell dumpsys activity activities | grep -Eq '(mResumedActivity|topResumedActivity).*org\.mozilla\.fenix\.debug'; then
              echo "Firefox is not in the foreground after 20 seconds."
              cat firefox-emulator-log.txt
              exit 1
            fi
            echo "Firefox is in the foreground after 20 seconds."

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-emulator-log
          path: firefox-emulator-log.txt
          if-no-files-found: warn          
